[project]
name = "quant-teaching-platform"
version = "0.1.0"
description = "面向教学的智能体驱动量化算法策略平台 - 后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jieba>=0.42",
    "numpy>=2.0",
    "openai>=1.60",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rank-bm25>=0.2.2",
    "sqlmodel>=0.0.22",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
# 只有更新行情数据（scripts/download_data.py）才需要；部署运行平台不需要
data = ["akshare>=1.16"]

[tool.uv]
package = false
# 本地开发默认全装；服务器最小化部署用 uv sync --no-default-groups
default-groups = ["dev", "data"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905", "SIM108", "SIM905", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
